worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker-встроенный DNS: имя сервиса api резолвится во все реплики
    resolver 127.0.0.11 valid=3s ipv6=off;

    server {
        listen 80;

        location /api/ {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # фото товаров: бакет products в MinIO (публичное чтение)
        location /products/ {
            # host-gateway-имя из /etc/hosts — статический proxy_pass надёжен
            proxy_pass http://minio:9000;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://web:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
