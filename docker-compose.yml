services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Бакет products с публичным чтением — один раз при старте стека
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      (mc mb -p local/products || true) &&
      mc anonymous set download local/products
      "

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://catalog:catalog@postgres:5432/catalog
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-http://localhost:9000}
    depends_on:
      postgres:
        condition: service_healthy
    # Stateless: можно поднять несколько реплик, nginx сам увидит их по DNS
    # (демо: docker compose up --scale api=3 --no-deps -d api)
    expose:
      - "8000"

  bot:
    build: ./bot
    restart: unless-stopped
    env_file: ./bot/.env
    environment:
      DATABASE_URL: postgresql://catalog:catalog@postgres:5432/catalog
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    expose:
      - "3000"

  # Точка входа: / -> web, /api -> пул реплик api.
  # С переменной в proxy_pass nginx ходит в DNS на каждый запрос,
  # поэтому --scale api=N подхватывается без перезагрузки конфига.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - web
      - api

volumes:
  pgdata:
  miniodata:
